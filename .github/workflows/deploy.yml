name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://gurukela-api.sourcecode.lk/api

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gurukela.sourcecode.lk
          username: gurukela@gurukela.sourcecode.lk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: /

      # Passenger restarts the Node app when tmp/restart.txt changes.
      - name: Prepare backend restart trigger
        run: |
          mkdir -p backend/tmp
          date > backend/tmp/restart.txt

      - name: Deploy backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gurukela.sourcecode.lk
          username: gurukela-api@gurukela-api.sourcecode.lk
          password: ${{ secrets.FTP_PASSWORD_API }}
          # This account's server requires explicit TLS (plain FTP hangs).
          protocol: ftps
          local-dir: backend/
          server-dir: /
          # .env (secrets) is created once by hand in cPanel and never overwritten.
          exclude: |
            **/node_modules/**
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/README.md
